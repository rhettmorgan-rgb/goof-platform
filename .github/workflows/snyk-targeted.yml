name: Snyk Security Scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

env:
  SNYK_OAUTH_CLIENT_ID: ${{ secrets.SNYK_OAUTH_CLIENT_ID }}
  SNYK_OAUTH_CLIENT_SECRET: ${{ secrets.SNYK_OAUTH_CLIENT_SECRET }}

jobs:
  sca-js:
    name: SCA / JavaScript (SCA/JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - name: snyk test
        working-directory: SCA/JS
        run: snyk test --severity-threshold=high --sarif-file-output=snyk-sca-js.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: SCA/JS/snyk-sca-js.sarif
          category: snyk-sca-js
      - name: snyk monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: SCA/JS
        run: snyk monitor --project-name=goof-platform-sca-js

  sca-python:
    name: SCA / Python (SCA/Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: npm install -g snyk
      - name: Install pinned Python packages
        # Snyk's pip scan resolves against packages present in the environment;
        # with none installed it finds nothing. Installed one-per-line because
        # `pip install -r` is all-or-nothing - lxml 4.5.0 needs libxslt headers
        # that aren't on the runner, and that single build failure otherwise
        # aborts the whole install. "--no-deps" keeps each pinned version exactly
        # as written (these pins conflict with each other), and the "|| echo"
        # lets a package that can't build be skipped rather than failing the job.
        run: |
          grep -vE "^[[:space:]]*(#|$)" SCA/Python/requirements.txt | while IFS= read -r pkg; do
            pip install --no-deps "$pkg" || echo "skipped: $pkg"
          done
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - name: snyk test
        run: snyk test --file=SCA/Python/requirements.txt --package-manager=pip --skip-unresolved=true --severity-threshold=high --sarif-file-output=snyk-sca-python.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-sca-python.sarif
          category: snyk-sca-python
      - name: snyk monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: snyk monitor --file=SCA/Python/requirements.txt --package-manager=pip --skip-unresolved=true --project-name=goof-platform-sca-python

  sca-java:
    name: SCA / Java (SCA/Java/todolist-web-struts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - name: snyk test
        working-directory: SCA/Java
        run: snyk test --maven-aggregate-project --severity-threshold=high --sarif-file-output=snyk-sca-java.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: SCA/Java/snyk-sca-java.sarif
          category: snyk-sca-java
      - name: snyk monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: SCA/Java
        run: snyk monitor --maven-aggregate-project

  code:
    name: Static analysis (Snyk Code / Code dir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - name: snyk code test
        run: snyk code test Code --severity-threshold=high --sarif-file-output=snyk-code.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code
      # Snyk Code has no "monitor" subcommand; "--report" is its equivalent,
      # publishing findings to the Snyk Web UI so they can be triaged and
      # ignored there. Requires the View Ignores permission on the service
      # account's role, or it returns 403.
      - name: snyk code report
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: snyk code test Code --report --project-name=goof-platform-code --target-name=rhettmorgan-rgb/goof-platform || true

  container:
    name: Container (Container/Dockerfile base image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      # The Dockerfile's build context isn't self-contained in this repo (COPY .
      # expects an app source tree that isn't checked in under Container/), so we
      # scan the base image it declares (node:6-stretch) plus Dockerfile hygiene
      # instead of building a derived image.
      - run: docker pull node:6-stretch
      - name: snyk container test
        run: snyk container test node:6-stretch --file=Container/Dockerfile --severity-threshold=high --sarif-file-output=snyk-container.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container
      - name: snyk container monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: snyk container monitor node:6-stretch --file=Container/Dockerfile --project-name=goof-platform-container

  container-smoke:
    name: Container (Code/test/smoke/Dockerfile base image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - run: docker pull alpine
      - name: snyk container test
        run: snyk container test alpine --file=Code/test/smoke/Dockerfile --severity-threshold=high --sarif-file-output=snyk-container-smoke.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-container-smoke.sarif
          category: snyk-container-smoke
      - name: snyk container monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: snyk container monitor alpine --file=Code/test/smoke/Dockerfile --project-name=goof-platform-container-smoke

  iac:
    name: Infrastructure as Code (IaC/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g snyk
      - name: Authenticate (OAuth service account)
        run: snyk auth --auth-type=oauth --client-id="$SNYK_OAUTH_CLIENT_ID" --client-secret="$SNYK_OAUTH_CLIENT_SECRET"
      - name: snyk iac test
        run: snyk iac test IaC --severity-threshold=high --sarif-file-output=snyk-iac.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac
      - name: snyk iac monitor
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: snyk iac test IaC --report --project-name=goof-platform-iac
